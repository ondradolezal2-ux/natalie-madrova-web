<!DOCTYPE html>
<!-- Předloha obrázku pro sdílení odkazu (1200 × 630). Snímek se uloží do assets/img/og-image.jpg. -->
<html lang="cs">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  /* stejně jako úvod webu: za Natkou kamenná plocha, směrem k textu béžová */
  body { position: relative; background:
    linear-gradient(to right, var(--wall) 0%, var(--wall) 38%, rgba(246, 243, 236, 0) 62%),
    radial-gradient(ellipse 52% 85% at 76% 40%, var(--zone) 0%, var(--zone-mid) 60%, #bfbab3 100%); }
  .photo { position: absolute; top: 0; bottom: 0; right: 70px; aspect-ratio: 733 / 1100; filter: sepia(0.22);
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 30%, #000 78%, transparent 100%); mask-image: linear-gradient(to right, transparent 0, #000 30%, #000 78%, transparent 100%); }
  .photo img { width: 100%; height: 100%; max-width: none;
    -webkit-mask-image: linear-gradient(to top, transparent 0, #000 16%); mask-image: linear-gradient(to top, transparent 0, #000 16%); }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; width: 640px; }
  .name { font-size: 104px; line-height: .94; font-weight: 620; font-stretch: 125%; letter-spacing: -0.035em; }
  .role { margin-top: 30px; max-width: none; font-size: 32px; line-height: 1.22; font-weight: 500; letter-spacing: -0.01em; color: var(--ink); }
  .tel { margin-top: 30px; font-size: 24px; font-weight: 560; font-stretch: 110%; color: var(--ink-2); }
</style>
</head>
<body>
  <div class="photo"><img src="../assets/img/portraits/natalie-05-mercedes.jpg" alt=""></div>
  <div class="copy">
    <div class="name">Natálie<br>Mádrová</div>
    <div class="role">Realitní a finanční poradkyně<br>pro Rychnovsko a Hradecko</div>
    <div class="tel">+420 604 306 514</div>
  </div>
</body>
</html>
